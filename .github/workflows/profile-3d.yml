name: GitHub-Profile-3D-Contrib

on:
  schedule: # Atualiza automaticamente todos os dias às 00:00 (horário de Brasília)
    - cron: "0 3 * * *"
  workflow_dispatch: # Permite executar manualmente a qualquer momento

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-github-profile-3d-contrib
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{secrets.PROFILE_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
      - name: Commit & Push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A .
          if ! git diff --staged --quiet; then
            git commit -m "chore: update 3D contribution graph"
            git push
          fi
